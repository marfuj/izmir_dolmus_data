name: events
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Etkinlikleri cek
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          LANDMARKS_JSON: landmarks.json
        run: python fetch_events.py events_izmir.json
      - name: Degistiyse commit et
        run: |
          git config user.name "events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events_izmir.json
          git diff --cached --quiet || git commit -m "events: otomatik guncelleme"
          git push
